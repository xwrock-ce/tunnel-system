name: Build and Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/xwrock-ce/tunnel-system-backend
          tags: |
            type=raw,value=main
            type=raw,value=${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Docker meta (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/xwrock-ce/tunnel-system-frontend
          tags: |
            type=raw,value=main
            type=raw,value=${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 180m
          command_timeout: 180m
          envs: GHCR_PAT,GITHUB_SHA
          script: |
            set -euo pipefail

            DEPLOY_PATH="/srv/tunnel-system"
            cd "$DEPLOY_PATH"

            mkdir -p model_weights uploads static

            if command -v git >/dev/null 2>&1 && [ -d .git ]; then
              git fetch --all || true
              git reset --hard origin/main || true
            fi

            echo "$GHCR_PAT" | docker login ghcr.io -u xwrock-ce --password-stdin

            echo "Disk usage before cleanup:"
            df -h
            docker system df || true

            echo "Pruning unused Docker data to free space..."
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            echo "Disk usage after cleanup:"
            df -h
            docker system df || true

            IMAGE_TAG="$GITHUB_SHA" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="$GITHUB_SHA" docker compose -f docker-compose.prod.yml up -d --remove-orphans
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_SHA: ${{ github.sha }}
