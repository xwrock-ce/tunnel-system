name: Build and Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/xwrock-ce/tunnel-system-backend
          tags: |
            type=raw,value=main
            type=raw,value=${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Docker meta (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/xwrock-ce/tunnel-system-frontend
          tags: |
            type=raw,value=main
            type=raw,value=${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 180m
          command_timeout: 180m
          envs: GHCR_PAT,GITHUB_SHA,GITHUB_REPOSITORY,REPO_URL,REPO_BRANCH,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_PATH="/srv/tunnel-system"
            REPO_URL="${REPO_URL:-https://github.com/${GITHUB_REPOSITORY}.git}"
            REPO_BRANCH="${REPO_BRANCH:-main}"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if command -v git >/dev/null 2>&1; then
              if [ -d .git ]; then
                echo "Existing git repo found, syncing latest code..."
                git fetch --all --prune || true
                git reset --hard "origin/${REPO_BRANCH}" || true
              elif [ -f docker-compose.prod.yml ]; then
                echo "Existing deployment files found (non-git), skip clone."
              else
                echo "Deployment directory is not initialized, cloning repository..."
                TMP_PATH="/tmp/tunnel-system-${GITHUB_SHA}"
                rm -rf "$TMP_PATH"
                git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" "$TMP_PATH"
                rm -rf "$DEPLOY_PATH"
                mv "$TMP_PATH" "$DEPLOY_PATH"
                cd "$DEPLOY_PATH"
              fi
            else
              echo "ERROR: git is not installed on the server."
              exit 1
            fi

            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi
            if [ ! -f .env ]; then
              touch .env
            fi

            upsert_env_var() {
              local key="$1"
              local value="$2"
              local file=".env"
              local tmp_file
              tmp_file="$(mktemp)"

              awk -v k="$key" -v v="$value" '
                BEGIN { updated = 0 }
                $0 ~ ("^" k "=") { print k "=" v; updated = 1; next }
                { print }
                END { if (!updated) print k "=" v }
              ' "$file" > "$tmp_file"

              mv "$tmp_file" "$file"
            }

            if [ -n "${ADMIN_USERNAME:-}" ]; then
              upsert_env_var "ADMIN_USERNAME" "$ADMIN_USERNAME"
            fi
            if [ -n "${ADMIN_PASSWORD:-}" ]; then
              upsert_env_var "ADMIN_PASSWORD" "$ADMIN_PASSWORD"
            fi

            mkdir -p model_weights uploads static

            echo "$GHCR_PAT" | docker login ghcr.io -u xwrock-ce --password-stdin

            echo "Disk usage before cleanup:"
            df -h
            docker system df || true

            echo "Pruning unused Docker data to free space..."
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            echo "Disk usage after cleanup:"
            df -h
            docker system df || true

            IMAGE_TAG="$GITHUB_SHA" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="$GITHUB_SHA" docker compose -f docker-compose.prod.yml up -d --remove-orphans
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          REPO_BRANCH: main
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
