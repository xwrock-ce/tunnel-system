version: "3.9"

services:
  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tunnel-net
    restart: unless-stopped

  # Backend (Go + Python ML worker)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./model_weights:/app/model_weights:ro
      - ./uploads:/app/uploads
      - ./static:/app/static
      - tunnel_db:/app/backend/data
    environment:
      - BASE_DIR=/app
      - SAM2_REPO_PATH=/app/backend/third_party/sam2
      - MODEL_WEIGHTS_DIR=/app/model_weights
      - YOLO_WEIGHTS=yolo_best.pt
      - CRACK_YOLO_WEIGHTS=crack_best.pt
      - DATABASE_URL=sqlite+aiosqlite:///./data/tunnel.db
      - SECRET_KEY=${SECRET_KEY:-tunnel-excavation-secret-key-change-in-production}
      - DEBUG=false
      - ADMIN_USERNAME=${ADMIN_USERNAME:-rockxw}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-csustxw}
      - PYTHONPATH=/app/backend
    networks:
      - tunnel-net
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  tunnel_db:

networks:
  tunnel-net:
    driver: bridge
