openapi: 3.0.3
info:
  title: Tunnel System API
  version: 1.1.0
  description: |
    OpenAPI definition for the tunnel face analysis backend.

    The API provides JWT authentication, single/batch analysis creation,
    history/statistics queries, public image retrieval, and WebSocket progress updates.
servers:
  - url: /
tags:
  - name: Meta
  - name: Auth
  - name: Analysis
  - name: Stats
  - name: System
paths:
  /:
    get:
      tags: [Meta]
      summary: Get API root metadata
      operationId: getRoot
      responses:
        '200':
          description: Root metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'
  /health:
    get:
      tags: [Meta]
      summary: Get service health
      operationId: getHealth
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      tags: [Meta]
      summary: Get versioned service health
      operationId: getVersionedHealth
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with JSON credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Login with form credentials
      operationId: loginForm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/analysis:
    get:
      tags: [Analysis]
      summary: List current user's analyses
      operationId: listAnalyses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          description: Filters by excavation status in the current implementation.
          schema:
            $ref: '#/components/schemas/ExcavationStatus'
        - in: query
          name: search
          description: Numeric analysis id search.
          schema:
            type: string
      responses:
        '200':
          description: Analysis list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Analysis]
      summary: Create a single analysis task
      operationId: createAnalysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                design_area:
                  type: number
                  format: double
                  minimum: 0
                scale:
                  type: number
                  format: double
                  minimum: 0
                analysis_type:
                  $ref: '#/components/schemas/AnalysisType'
      responses:
        '200':
          description: Analysis task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/analysis/batch:
    post:
      tags: [Analysis]
      summary: Create analysis tasks for multiple images
      operationId: createBatchAnalysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                design_area:
                  type: number
                  format: double
                  minimum: 0
                scale:
                  type: number
                  format: double
                  minimum: 0
                analysis_type:
                  $ref: '#/components/schemas/AnalysisType'
      responses:
        '200':
          description: Batch analysis tasks created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAnalysisCreateResponse'
        '400':
          description: Invalid multipart payload or too many files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/analysis/{analysisID}:
    get:
      tags: [Analysis]
      summary: Get one analysis detail
      operationId: getAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalysisID'
      responses:
        '200':
          description: Analysis detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Analysis]
      summary: Delete one analysis owned by the current user
      operationId: deleteAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalysisID'
      responses:
        '200':
          description: Analysis deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/analysis/{analysisID}/image/{imageType}:
    get:
      tags: [Analysis]
      summary: Get one generated or original analysis image
      operationId: getAnalysisImage
      parameters:
        - $ref: '#/components/parameters/AnalysisID'
        - $ref: '#/components/parameters/ImageType'
      responses:
        '200':
          description: Image file bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/bmp:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/analysis/ws/{analysisID}:
    get:
      tags: [Analysis]
      summary: Connect to analysis progress WebSocket
      description: |
        Upgrades the connection to WebSocket. Messages emitted by the backend use the
        `WebSocketMessage` schema with `type` values such as `progress`, `result`, and `error`.
      operationId: connectAnalysisWebSocket
      parameters:
        - $ref: '#/components/parameters/AnalysisID'
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/analysis/stats/dashboard:
    get:
      tags: [Stats]
      summary: Get dashboard summary statistics
      operationId: getDashboardStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/analysis/stats/trend:
    get:
      tags: [Stats]
      summary: Get historical trend data
      operationId: getTrendData
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Trend data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/analysis/stats/distribution:
    get:
      tags: [Stats]
      summary: Get deviation distribution buckets
      operationId: getDeviationDistribution
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Distribution buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/system/status:
    get:
      tags: [System]
      summary: Get backend resource and model status
      operationId: getSystemStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resource and model status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AnalysisID:
      in: path
      name: analysisID
      required: true
      schema:
        type: integer
        minimum: 1
      description: Analysis record id.
    ImageType:
      in: path
      name: imageType
      required: true
      schema:
        $ref: '#/components/schemas/ImageType'
      description: Which image artifact to fetch.
  responses:
    BadRequest:
      description: Invalid request input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailError'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailError'
    Forbidden:
      description: Access denied for the target resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailError'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailError'
  schemas:
    RootResponse:
      type: object
      required: [name, version, docs, api]
      properties:
        name:
          type: string
        version:
          type: string
        docs:
          type: string
          example: /docs
        api:
          type: string
          example: /api/v1
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: healthy
    DetailError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
    UserResponse:
      type: object
      required: [id, username, is_active, created_at]
      properties:
        id:
          type: integer
        username:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    AnalysisType:
      type: string
      enum: [face_segmentation, crack_detection, full]
    AnalysisStatus:
      type: string
      enum: [pending, processing, completed, failed]
    ExcavationStatus:
      type: string
      enum: [over_excavation, under_excavation, within_tolerance]
    ImageType:
      type: string
      enum: [original, mask, overlay, crack_mask, crack_overlay, combined_overlay]
    AnalysisCreateResponse:
      type: object
      required: [id, status, message]
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        message:
          type: string
    BatchAnalysisCreateResponse:
      type: object
      required: [batch_id, task_ids, total]
      properties:
        batch_id:
          type: string
        task_ids:
          type: array
          items:
            type: integer
        total:
          type: integer
    ExcavationResultResponse:
      type: object
      required: [pixel_count, actual_area_m2, design_area_m2, difference_m2, difference_percent, status]
      properties:
        pixel_count:
          type: integer
        actual_area_m2:
          type: number
          format: double
        design_area_m2:
          type: number
          format: double
        difference_m2:
          type: number
          format: double
        difference_percent:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/ExcavationStatus'
    SegmentationMetricsResponse:
      type: object
      required: [confidence]
      properties:
        confidence:
          type: number
          format: double
        mask_quality:
          type: string
          nullable: true
          example: high
        crack_confidence:
          type: number
          format: double
          nullable: true
        crack_count:
          type: integer
          nullable: true
        crack_pixel_count:
          type: integer
          nullable: true
    AnalysisResponse:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        analysis_type:
          allOf:
            - $ref: '#/components/schemas/AnalysisType'
          nullable: true
        design_area_m2:
          type: number
          format: double
          nullable: true
        scale_mm_per_pixel:
          type: number
          format: double
          nullable: true
        original_image_url:
          type: string
          nullable: true
        mask_image_url:
          type: string
          nullable: true
        overlay_image_url:
          type: string
          nullable: true
        crack_mask_image_url:
          type: string
          nullable: true
        crack_overlay_image_url:
          type: string
          nullable: true
        combined_overlay_image_url:
          type: string
          nullable: true
        excavation:
          allOf:
            - $ref: '#/components/schemas/ExcavationResultResponse'
          nullable: true
        metrics:
          allOf:
            - $ref: '#/components/schemas/SegmentationMetricsResponse'
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    AnalysisListItemResponse:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        excavation_status:
          allOf:
            - $ref: '#/components/schemas/ExcavationStatus'
          nullable: true
        actual_area_m2:
          type: number
          format: double
          nullable: true
        difference_percent:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
    AnalysisListResponse:
      type: object
      required: [items, total, page, pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisListItemResponse'
        total:
          type: integer
        page:
          type: integer
        pages:
          type: integer
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    StatsResponse:
      type: object
      required:
        [
          total_analyses,
          today_analyses,
          yesterday_analyses,
          over_excavation_count,
          under_excavation_count,
          normal_count,
          avg_difference_percent
        ]
      properties:
        total_analyses:
          type: integer
        today_analyses:
          type: integer
        yesterday_analyses:
          type: integer
        today_vs_yesterday_percent:
          type: number
          format: double
          nullable: true
        over_excavation_count:
          type: integer
        under_excavation_count:
          type: integer
        normal_count:
          type: integer
        avg_difference_percent:
          type: number
          format: double
    TrendDataPointResponse:
      type: object
      required: [id, label, over_excavation_area, under_excavation_area, created_at]
      properties:
        id:
          type: integer
        label:
          type: string
        over_excavation_area:
          type: number
          format: double
        under_excavation_area:
          type: number
          format: double
        difference_percent:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
    TrendResponse:
      type: object
      required: [labels, over_excavation_data, under_excavation_data, data_points]
      properties:
        labels:
          type: array
          items:
            type: string
        over_excavation_data:
          type: array
          items:
            type: number
            format: double
        under_excavation_data:
          type: array
          items:
            type: number
            format: double
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/TrendDataPointResponse'
    DistributionResponse:
      type: object
      required: [severe_over_count, minor_over_count, normal_count, minor_under_count, severe_under_count]
      properties:
        severe_over_count:
          type: integer
        minor_over_count:
          type: integer
        normal_count:
          type: integer
        minor_under_count:
          type: integer
        severe_under_count:
          type: integer
    SystemResourceStatusResponse:
      type: object
      required: [cpu_percent, memory_percent, memory_used_gb, memory_total_gb, gpu_available]
      properties:
        cpu_percent:
          type: number
          format: double
        memory_percent:
          type: number
          format: double
        memory_used_gb:
          type: number
          format: double
        memory_total_gb:
          type: number
          format: double
        gpu_percent:
          type: number
          format: double
          nullable: true
        gpu_memory_used_gb:
          type: number
          format: double
          nullable: true
        gpu_memory_total_gb:
          type: number
          format: double
          nullable: true
        gpu_available:
          type: boolean
    ModelStatusResponse:
      type: object
      required: [name, version, status, loaded]
      properties:
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [online, standby, offline]
        speed:
          type: string
          nullable: true
        loaded:
          type: boolean
    SystemStatusResponse:
      type: object
      required: [resources, models]
      properties:
        resources:
          $ref: '#/components/schemas/SystemResourceStatusResponse'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelStatusResponse'
        uptime_seconds:
          type: number
          format: double
          nullable: true
    WebSocketMessage:
      type: object
      required: [type, stage, progress, message]
      properties:
        type:
          type: string
          example: progress
        stage:
          type: string
          example: segmentation
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
